<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DIINSA Confirma</title>
<meta name="description" content="Prototipo del protocolo de doble validación y liberación de pedidos de DIINSA (Integrador VIII, Grupo 8, UNAN-Managua). Datos ficticios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Roboto:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<style>
/* Layout: marca de DIINSA a la izquierda, teléfono a la derecha, controles arriba a la derecha y panel interno bajo la marca. */
:root{
  color-scheme: light;
  --green:#006C4F; --green-700:#00523C; --green-50:#E7F2EE; --green-100:#CFE6DD;
  --red:#E41820; --red-700:#B3141A; --red-50:#FDECEC;
  --ink:#15241E; --muted:#56655F; --line:#DCE6E1; --paper:#FFFFFF; --mist:#F4F8F6; --sky:#E3F1F5;
  --amber:#9A5B00; --amber-50:#FFF3DC; --blue:#1D5C9E; --blue-50:#E8F1FB;
  --wa-bg:#EFEAE2; --wa-in:#FFFFFF; --wa-out:#D9FDD3; --wa-text:#111B21; --wa-meta:#667781; --wa-btn:#007A5E;
  --display:'Montserrat', 'Arial Black', Arial, sans-serif;
  --ui:'Source Sans 3', 'Segoe UI', Arial, sans-serif;
  --phone:'Roboto', 'Segoe UI', Arial, sans-serif;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);overflow-x:hidden}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #2A78D6;outline-offset:2px}

/* decoración */
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.deco .sun{position:absolute;width:42vmax;height:42vmax;border-radius:50%;background:var(--sky);top:-18vmax;right:14vw;opacity:.75}
.deco svg{position:absolute;right:-2vw;bottom:-3vh;width:min(44vw,600px);height:auto}

.stage{position:relative;z-index:1;min-height:100%;max-width:1480px;margin:0 auto;display:grid;
  grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto 1fr auto;
  grid-template-areas:"top top" "brand phone" "ops phone" "foot foot";
  column-gap:clamp(24px,5vw,96px);row-gap:18px;
  padding-block:16px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra superior */
.topbar{grid-area:top;display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--mist);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:7px 14px;border-radius:999px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--green-700);box-shadow:0 1px 3px rgba(0,60,40,.18)}
.tb-btn{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.tb-btn svg{width:16px;height:16px}
.cases{position:relative}
.cases > button{background:var(--green);color:#fff;border:0;font-weight:700;font-size:15px;padding:10px 18px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 16px -8px rgba(0,82,60,.6)}
.cases > button svg{width:18px;height:18px;transition:transform .2s}
.cases > button[aria-expanded="true"] svg{transform:rotate(180deg)}
.case-list{position:absolute;right:0;top:calc(100% + 8px);width:min(420px,calc(100vw - 32px));max-height:min(72vh,680px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 48px -20px rgba(0,40,28,.45);padding:8px;z-index:60}
.case-list h3{font:700 11.5px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--green);margin:12px 10px 4px}
.case-list button{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:10px;color:var(--ink);font-size:14.5px;line-height:1.3}
.case-list button:hover{background:var(--mist)}
.case-list button[aria-current="true"]{background:var(--green-50)}
.case-list .n{font:700 12px var(--ui);color:var(--muted);background:var(--mist);border-radius:6px;text-align:center;padding:2px 0;font-variant-numeric:tabular-nums}
.case-list button[aria-current="true"] .n{background:var(--green);color:#fff}
.case-list small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}

/* marca */
.brand{grid-area:brand;align-self:end;display:flex;flex-direction:column;gap:10px;min-width:0;padding-left:clamp(0px,2.5vw,40px)}
.brand .logo{width:clamp(130px,min(16vw,19vh),250px);height:auto;display:block;margin-bottom:4px}
.wordmark{margin:0;font-family:var(--display);font-weight:900;line-height:.95;letter-spacing:-.01em;font-size:clamp(38px,min(5.6vw,7.6vh),92px);display:flex;flex-direction:column}
.wordmark .w1{color:var(--green)} .wordmark .w2{color:var(--red)}
.tagline{margin:6px 0 0;font-family:var(--display);font-weight:600;font-size:clamp(17px,min(1.9vw,3vh),27px);color:var(--ink);position:relative;width:fit-content;max-width:100%;text-wrap:balance}
.tagline svg{display:block;width:62%;height:12px;margin-top:4px;margin-left:auto}

/* panel interno */
.ops{grid-area:ops;align-self:start;max-width:540px;margin-left:clamp(0px,2.5vw,40px);background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px 16px;box-shadow:0 16px 36px -24px rgba(0,60,40,.45)}
.ops-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ops h2{margin:0;font:700 12.5px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--green)}
.ops .vis{font-size:12.5px;color:var(--muted)}
.ops-meta{margin:6px 0 10px;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between}
.ops-meta b{color:var(--ink)}
.ops-meta .clock{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.status{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{background:var(--mist);border-radius:12px;padding:7px 10px;min-width:0}
.st-l{display:block;font:700 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pill{display:inline-block;border-radius:8px;padding:3px 8px;font-size:13.5px;font-weight:600;line-height:1.3}
.pill.ok{background:var(--green-50);color:var(--green-700)}
.pill.warn{background:var(--amber-50);color:var(--amber)}
.pill.stop{background:var(--red-50);color:var(--red-700)}
.pill.info{background:var(--blue-50);color:var(--blue)}
.pill.neutral{background:#E9EEEC;color:#3E4C46}
.req{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.req-idle{margin:0 0 8px;font-size:14.5px;color:var(--muted)}
.req-card h3{margin:0 0 2px;font:700 16px var(--ui);color:var(--ink);display:flex;gap:8px;align-items:center}
.req-card h3 .dot{width:9px;height:9px;border-radius:50%;background:#E8A317;box-shadow:0 0 0 4px #FCEFD2;animation:pulse 1.6s infinite}
.req-card .when{font-size:13px;color:var(--muted)}
.req-card ul{margin:6px 0 8px;padding-left:18px;font-size:14.5px;line-height:1.4}
.rule{font-size:13px;color:var(--blue);background:var(--blue-50);border-radius:10px;padding:7px 10px;margin:0 0 10px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts button{border-radius:10px;padding:9px 13px;font-weight:700;font-size:14px;border:1.5px solid transparent;display:inline-flex;align-items:center;gap:6px}
.acts .a-ok{background:var(--green);color:#fff}
.acts .a-no{background:#fff;color:var(--red-700);border-color:#EBB0B3}
.acts .a-alt{background:#fff;color:var(--blue);border-color:#B7CDEA}
.acts button:disabled{cursor:default;opacity:.55}
.acts button.chosen{opacity:1;outline:3px solid #E8A317;outline-offset:2px}
.acts .sug{font:700 10.5px var(--ui);letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.25);border-radius:6px;padding:1px 5px}
.acts .a-no .sug,.acts .a-alt .sug{background:var(--mist)}
.auto-note{margin:8px 0 0;font-size:13px;color:var(--muted)}
.ghost{border:1.5px dashed var(--green-100);background:#fff;color:var(--green-700);font-weight:700;font-size:14px;border-radius:10px;padding:8px 12px}

/* teléfono */
.phone-col{grid-area:phone;align-self:center;display:flex;justify-content:center;padding-right:clamp(0px,3vw,56px)}
.phone{--h:min(800px,calc(100dvh - 120px));--fs:clamp(12.5px,calc(var(--h) * .0182),14.5px);height:var(--h);min-height:600px;width:calc(var(--h) * .485);min-width:300px;max-width:100%;background:#0D1311;border-radius:48px;padding:11px;position:relative;box-shadow:0 40px 70px -30px rgba(0,50,35,.55),0 0 0 2px #2A3330 inset,0 0 0 1px #000}
.phone::before{content:"";position:absolute;right:-3px;top:150px;width:3px;height:64px;background:#1E2724;border-radius:0 3px 3px 0}
.screen{position:relative;height:100%;border-radius:38px;overflow:hidden;background:var(--wa-bg);display:flex;flex-direction:column;font-family:var(--phone)}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:92px;height:25px;border-radius:20px;background:#000;z-index:30}
.sbar{height:42px;flex:none;background:var(--green-700);color:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 5px 28px;font:500 14px var(--phone);font-variant-numeric:tabular-nums}
.sbar .ic{display:flex;gap:5px;align-items:center}
.sbar svg{width:16px;height:16px;fill:#fff}
.wa-head{flex:none;background:var(--green);color:#fff;display:flex;align-items:center;gap:9px;padding:7px 10px 9px 6px}
.wa-head .back{width:22px;height:22px;fill:#fff}
.avatar{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.avatar img{width:31px;height:31px}
.wa-name{flex:1;min-width:0;line-height:1.15}
.wa-name b{display:flex;align-items:center;gap:4px;font-size:16.5px;font-weight:500}
.wa-name b svg{width:15px;height:15px}
.wa-name span{font-size:12.5px;opacity:.88}
.wa-head .tools{display:flex;gap:16px;padding-right:4px}
.wa-head .tools svg{width:20px;height:20px;fill:#fff}
.chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 9px 12px;display:flex;flex-direction:column;background-color:var(--wa-bg);background-image:radial-gradient(rgba(84,72,58,.07) 1.2px,transparent 1.6px),radial-gradient(rgba(84,72,58,.05) 1px,transparent 1.4px);background-size:22px 22px,15px 15px;background-position:0 0,7px 9px;scrollbar-width:thin}
.chip{align-self:center;background:#FFFFFF;color:#54656F;font-size:12px;font-weight:500;padding:5px 11px;border-radius:8px;margin:6px 0 4px;box-shadow:0 1px .5px rgba(11,20,26,.13);text-transform:uppercase;letter-spacing:.02em}
.msg{display:flex;flex-direction:column;max-width:88%;margin-top:5px}
.msg.in{align-self:flex-start} .msg.out{align-self:flex-end;max-width:80%}
.bubble{position:relative;background:var(--wa-in);color:var(--wa-text);border-radius:9px;padding:6px 8px 5px 9px;font-size:var(--fs,14.5px);line-height:1.37;box-shadow:0 1px .5px rgba(11,20,26,.13);overflow-wrap:anywhere}
.msg.in:not(.cont) .bubble{border-top-left-radius:2px}
.msg.out .bubble{background:var(--wa-out);border-top-right-radius:2px}
.meta{float:right;display:inline-flex;align-items:center;gap:3px;margin:8px 0 -4px 12px;font-size:11px;color:var(--wa-meta);white-space:nowrap}
.meta svg{width:16px;height:11px}
.bubble b{font-weight:700}
.bubble .oh{margin-top:6px}
.bubble .ln{margin-top:4px}
.bubble .ln span{color:#3B4A54}
.bubble .ln.rm{color:#667781}
.bubble .diff{color:#0B7A55;font-style:italic;font-size:13.5px}
.bubble .keys{margin:7px 0 5px;padding-top:6px;border-top:1px solid #E5E1D8}
.bubble .warnline{display:block;margin-top:6px;background:#FFF6D9;border-radius:6px;padding:5px 7px;font-size:13.5px}
.bubble p{margin:5px 0 0}
.btns{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.btns button{background:#fff;border:0;border-radius:8px;padding:9px 10px;color:var(--wa-btn);font:500 var(--fs,14.5px) var(--phone);display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.btns button svg{width:17px;height:17px;fill:currentColor;flex:none}
.btns button:disabled{color:#9BB0A9;cursor:default}
.btns button.picked{color:#6E8F84;background:#F4F7F5}
.typing .bubble{display:flex;gap:4px;padding:11px 12px}
.typing i{width:7px;height:7px;border-radius:50%;background:#9AA5AB;animation:dots 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{flex:none;display:flex;align-items:flex-end;gap:6px;padding:5px 7px 12px;background:var(--wa-bg)}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#fff;border-radius:22px;padding:8px 12px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.field svg{width:21px;height:21px;fill:#8696A0;flex:none}
.field input{flex:1;min-width:0;border:0;outline:0;font:400 15px var(--phone);color:var(--wa-text);background:transparent}
.field input::placeholder{color:#8696A0}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--green);display:grid;place-items:center;flex:none}
.send svg{width:21px;height:21px;fill:#fff}

/* hojas dentro del teléfono */
.scrim{position:absolute;inset:0;background:rgba(11,20,26,.42);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:#fff;border-radius:18px 18px 0 0;z-index:25;display:flex;flex-direction:column;font-family:var(--phone)}
.sheet.enter{animation:up .22s ease-out}
.sheet-h{display:flex;align-items:center;gap:12px;padding:14px 14px 8px}
.sheet-h h3{margin:0;font-size:17px;font-weight:500;color:var(--wa-text)}
.xbtn{width:34px;height:34px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center}
.xbtn svg{width:22px;height:22px;fill:#54656F}
.sheet-b{overflow-y:auto;padding:0 12px 10px}
.ed-note{margin:0 2px 10px;font-size:13px;color:#54656F;background:#F0F4F2;border-radius:10px;padding:8px 10px;line-height:1.35}
.ed-note.flash{animation:flash .9s}
.ed-note .no-add{display:block;margin-top:4px;color:var(--red-700);font-weight:700}
.ed-item{border:1px solid #E3E8E6;border-radius:14px;padding:10px 11px;margin-bottom:9px}
.ed-item.removed{background:#F7F7F7}
.ed-info b{display:block;font-weight:500;font-size:15px;color:var(--wa-text)}
.ed-info span{display:block;font-size:12.5px;color:#667781;margin-top:1px}
.ed-info em{font-style:normal;background:#DDF3E8;color:#0B6B4E;border-radius:6px;padding:0 6px;font-weight:500}
.ed-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
.ed-sub{font-size:12.5px;color:#667781;line-height:1.2}
.ed-sub b{display:block;color:var(--wa-text);font-size:14.5px}
.stepper{display:flex;align-items:center;border:1px solid #D5DDD9;border-radius:22px;overflow:hidden}
.stepper button{width:40px;height:36px;border:0;background:#fff;font-size:21px;color:var(--green);line-height:1}
.stepper button.off{color:#C3CCC8}
.stepper output{min-width:38px;text-align:center;font-size:16px;font-weight:500;border-inline:1px solid #E3E8E6;line-height:36px;font-variant-numeric:tabular-nums}
.ed-ask{margin-top:9px;background:#FFF6D9;border-radius:10px;padding:8px 9px;font-size:13.5px;color:#3B3000}
.ed-ask div{display:flex;gap:6px;margin-top:6px}
.ed-ask button,.ed-removed button,.dlg button{border-radius:16px;padding:6px 12px;font-size:13.5px;font-weight:500;border:1px solid #CBD5D1;background:#fff;color:var(--wa-text)}
.ed-ask button.yes,.dlg button.yes{background:var(--green);border-color:var(--green);color:#fff}
.ed-removed{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:13.5px;color:#667781}
.sheet-f{border-top:1px solid #E9EDEF;padding:10px 14px 14px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:#54656F}
.tot b{font-size:18px;color:var(--wa-text);font-variant-numeric:tabular-nums}
.tot small{display:block;font-size:12px}
.primary{width:100%;margin-top:9px;border:0;border-radius:22px;background:var(--green);color:#fff;font:500 15.5px var(--phone);padding:11px}
.primary:disabled{background:#B9CEC6;cursor:default}
.dlg{position:absolute;inset:0;background:rgba(255,255,255,.94);z-index:5;display:flex;align-items:center;justify-content:center;padding:18px;border-radius:18px 18px 0 0}
.dlg > div{background:#fff;border:1px solid #E3E8E6;border-radius:14px;padding:14px;box-shadow:0 10px 30px -12px rgba(0,0,0,.3)}
.dlg p{margin:0 0 10px;font-size:14.5px;color:var(--wa-text);line-height:1.4}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap}
.mot{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid #EEF1F2;background:#fff;padding:12px 6px;font:400 15px var(--phone);color:var(--wa-text)}
.mot i{width:20px;height:20px;border-radius:50%;border:2px solid #8696A0;flex:none}

/* tap del modo automático */
.tap{position:fixed;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(0,108,79,.22);border:2px solid rgba(0,108,79,.7);pointer-events:none;z-index:100;animation:tap .55s ease-out forwards}

.foot{grid-area:foot;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;padding-left:clamp(0px,2.5vw,40px);max-width:760px}
.foot b{color:var(--ink);font-weight:600}

@keyframes dots{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-3px);opacity:1}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes tap{from{transform:scale(.4);opacity:1}to{transform:scale(1.25);opacity:0}}
@keyframes pulse{50%{box-shadow:0 0 0 7px #FCEFD2}}
@keyframes flash{0%,100%{background:#F0F4F2}30%{background:#FDE2E2}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

@media (max-width: 940px){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"top" "brand" "phone" "ops" "foot";row-gap:16px}
  .brand{align-self:start;padding-left:0;flex-direction:row;flex-wrap:wrap;align-items:center;column-gap:18px}
  .brand .logo{width:clamp(110px,28vw,180px);margin:0}
  .wordmark{font-size:clamp(32px,9vw,56px)}
  .tagline{flex-basis:100%}
  .phone-col{padding-right:0}
  .phone{--h:700px;--fs:14.5px;height:min(700px,calc(100dvh - 40px));width:min(390px,100%);min-width:0;min-height:560px}
  .ops{margin-left:0;max-width:none}
  .foot{padding-left:0}
  .deco .sun{right:-20vmax}
}
@media (max-width: 420px){
  .phone{border-radius:40px;padding:8px}
  .screen{border-radius:33px}
  .status{grid-template-columns:1fr}
  .seg button{padding:7px 10px;font-size:13px}
}
</style>

<div class="deco" aria-hidden="true">
  <div class="sun"></div>
  <svg viewBox="0 0 800 260" preserveAspectRatio="xMaxYMax meet">
    <path d="M120 260 C 320 210, 560 120, 800 40 L 800 92 C 600 150, 380 230, 230 260 Z" fill="#006C4F" opacity=".95"/>
    <path d="M300 260 C 470 220, 650 160, 800 118 L 800 150 C 690 182, 540 226, 410 260 Z" fill="#E41820" opacity=".92"/>
  </svg>
</div>

const $ = s => document.querySelector(s);
const ABORT = Symbol('abort');
let RUN = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => 'C$' + Math.round(n).toLocaleString('en-US');
const uw = (l, q) => q === 1 ? l.u : l.up;
const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const LATE = 21 * 60, NEXT = 1440;
function fmt(min){
  const m = ((min % NEXT) + NEXT) % NEXT, h = Math.floor(m / 60), mm = m % 60;
  if (h === 12 && mm === 0) return '12:00 m.';
  return `${h % 12 || 12}:${String(mm).padStart(2, '0')} ${h < 12 ? 'a. m.' : 'p. m.'}`;
}
const short = min => { const m = ((min % NEXT) + NEXT) % NEXT; return `${Math.floor(m / 60) % 12 || 12}:${String(m % 60).padStart(2, '0')}`; };
const dayName = min => min >= NEXT ? 'Miércoles' : 'Martes';

/* ------------------------------------------------------------------ espera y ejecución */
async function wait(ms){
  const t = RUN; let left = ms;
  while (left > 0){
    if (t !== RUN) throw ABORT;
    await sleep(40);
    if (S.paused && S.mode === 'auto') continue;
    left -= 40 * (window.SPEED || 1);
  }
  if (t !== RUN) throw ABORT;
}
function run(fn, track = true){
  const t = RUN;
  if (track) S.busy++;
  return Promise.resolve().then(fn).catch(e => { if (e !== ABORT) console.error(e); })
    .finally(() => { if (track && t === RUN) S.busy = Math.max(0, S.busy - 1); });
}

/* ------------------------------------------------------------------ conversación */
function scrollChat(){ chat.scrollTo({ top:chat.scrollHeight, behavior:reduceMotion() ? 'auto' : 'smooth' }); }
function chip(text){ const d = document.createElement('div'); d.className = 'chip'; d.textContent = text; chat.append(d); }
function dayCheck(){ const d = S.clock >= NEXT ? 1 : 0; if (d > S.lastDay){ chip(dayName(S.clock)); S.lastDay = d; } }
function mkBtn(x){
  const b = document.createElement('button'); b.type = 'button'; b.dataset.k = x.k; b.dataset.label = x.label;
  b.innerHTML = (x.ic ? ICON[x.ic] : '') + `<span>${x.label}</span>`; return b;
}
function addMsg(side, html, opts = {}){
  dayCheck();
  const m = document.createElement('div'); m.className = 'msg ' + side;
  const prev = chat.lastElementChild; if (prev && prev.classList.contains(side) && !prev.classList.contains('has-btns')) m.classList.add('cont');
  const b = document.createElement('div'); b.className = 'bubble';
  b.innerHTML = html + `<span class="meta">${fmt(S.clock)}${side === 'out' ? TICKS : ''}</span>`;
  m.append(b);
  const list = [...(opts.buttons || []), ...(opts.list ? [{...opts.list, ic:'list'}] : [])];
  const noScroll = opts.noScroll;
  if (list.length){
    chat.querySelectorAll('.msg.has-btns button').forEach(x => { if (x.dataset.k !== 'reopen') x.disabled = true; });
    const g = document.createElement('div'); g.className = 'btns'; list.forEach(x => g.append(mkBtn(x)));
    m.append(g); m.classList.add('has-btns');
  }
  chat.append(m); if (!noScroll) scrollChat(); return m;
}
async function typing(ms){
  const t = document.createElement('div'); t.className = 'msg in typing';
  t.innerHTML = '<div class="bubble"><i></i><i></i><i></i></div>';
  chat.append(t); scrollChat(); $('#waSub').textContent = 'escribiendo…';
  try { await wait(ms); } finally { t.remove(); $('#waSub').textContent = 'Cuenta de empresa'; }
}
async function bot(html, opts = {}){ await typing(opts.t ?? Math.min(1500, 650 + html.length * 1.2)); return addMsg('in', html, opts); }
function user(text){
  if (!S.first) S.clock += 1; S.first = false; renderClock();
  return addMsg('out', esc(text));
}
function markResponded(){
  if (S.responded) return; S.responded = true;

}
const OPTS = () => [{k:'confirm', label:'Confirmar', ic:'check'}, {k:'modify', label:'Modificar', ic:'edit'}, {k:'cancel', label:'Cancelar pedido', ic:'x'}];

function lineHTML(l, q, base){
  if (q === 0) return `<div class="ln rm"><s><b>${l.n}</b></s> · ${l.p}<br><span>Se quita del pedido (eran ${base} ${uw(l, base)})</span></div>`;
  let diff = '';
  if (base != null && q < base){ const d = base - q; diff = ` <span class="diff">(${d} ${uw(l, d)} menos)</span>`; }
  return `<div class="ln"><b>${l.n}</b> · ${l.p}<br><span>${q} ${uw(l, q)} × C$${l.pr} = ${money(q * l.pr)}</span>${diff}</div>`;
}
function block(q, base){
  return S.o.lines.map((l, i) => (q[i] === 0 && (!base || base[i] === 0)) ? '' : lineHTML(l, q[i], base ? base[i] : null)).join('');
}
const DELIV = 'mañana miércoles, entre 8:00 a. m. y 12:00 m.';
const ORDER = () => `pedido N.º ${S.o.id}`;

}

async function afterMotive(){
  const m = S.motive;
  if (m === 'A' && !isLate()){
    await bot('Entendido. Si te sirve, podés recibir menos productos en lugar de cancelar todo el pedido. ¿Qué preferís?',

  } else if ((m === 'B' || m === 'C') && !isLate()){
    await bot('Entendido. ¿Querés que reprogramemos la entrega para el <b>miércoles de la próxima semana</b>, entre 8:00 a. m. y 12:00 m.? Queda sujeto a la planificación de rutas.',
      {buttons:[{k:'resched', label:'Sí, reprogramar', ic:'cal'}, {k:'cancel-go', label:'No, cancelar el pedido', ic:'x'}]});
  } else if (m === 'O'){
    S.expect = 'other';
    await bot('Contanos en un mensaje el motivo de la cancelación.');
    suggestText();
  } else {
    await cancelVerify();
  }
}

async function sendText(){

  input.value = ''; updateComposer();
  user(text); markResponded();
  if (S.expect === 'other'){ S.expect = null; S.motiveText = text.replace(/[.\s]+$/, ''); await cancelVerify(); return; }
  if (S.expect === 'info'){
    S.expect = null; S.infoGiven = true;
    await bot('Gracias por el detalle. Seguimos revisando tu solicitud 🕓');
    createPending({type:'cancel', late:isLate(), motive:S.motive, info:true});
    return;
  }
  if (S.pending){ await bot(`Tu solicitud del ${ORDER()} está en revisión; te avisamos la decisión antes de las 9:00 p. m.`); return; }
  if (S.answered && S.answered.type === 'confirmed'){
    const can = !isLate();
    await bot(`Ya registramos tu respuesta: tu ${ORDER()} quedó <b>confirmado hoy a las ${fmt(S.answered.at)}</b>` +
      (can ? ' Si necesitás cambiarla, tocá «Cambiar mi respuesta» antes de las 9:00 p. m.' : ''),
      can ? {buttons:[{k:'reopen', label:'Cambiar mi respuesta', ic:'edit'}]} : {});
    return;
  }
  if (S.answered && S.answered.type === 'decided'){ await bot(`Ya registramos tu respuesta: ${S.answered.text}.`); return; }
  await bot(`Gracias por escribirnos, ${S.o.name}. Para atender tu pedido usá las opciones del mensaje; así tu respuesta queda registrada. ¿Qué querés hacer?`, {buttons:OPTS()});
}
function suggestText(){
  const list = S.c.s.filter(x => x && x.type).map(x => x.type);
  if (S.mode === 'inter' && list[S.textIdx]){ input.value = list[S.textIdx]; updateComposer(); }
  S.textIdx++;
}
function updateComposer(){ $('#sendIc').innerHTML = input.value.trim() ? SEND_IC : MIC_IC; }

/* ------------------------------------------------------------------ hojas (editor y motivos) */
function openSheet(kind){ S.sheet = kind; renderSheet(true); }
function closeSheet(){ S.sheet = null; S.rmAsk = null; S.allAsk = null; host.innerHTML = ''; }
function openEditor(from){ S.draft = from ? [...from] : [...S.cur]; S.rmAsk = null; S.allAsk = null; openSheet('editor'); }
const alive = () => S.draft.filter(q => q > 0).length;
const changed = () => S.draft.some((q, i) => q !== S.cur[i]);
function renderSheet(enter){
  const prev = host.querySelector('.sheet-b'), top = prev ? prev.scrollTop : 0;
  if (S.sheet === 'editor') host.innerHTML = editorHTML();
  else if (S.sheet === 'motives') host.innerHTML = motivesHTML();
  else { host.innerHTML = ''; return; }
  const sh = host.querySelector('.sheet'); if (enter && sh) sh.classList.add('enter');
  const body = host.querySelector('.sheet-b');
  if (body && !enter) body.scrollTop = top;
  const ask = host.querySelector('.ed-ask');
  if (ask && body){
    const r = ask.getBoundingClientRect(), b = body.getBoundingClientRect();
    if (r.bottom > b.bottom) body.scrollTop += r.bottom - b.bottom + 10;
  }
}
function editorHTML(){
  const items = S.o.lines.map((l, i) => {
    const max = S.cur[i]; if (max === 0) return '';
    const q = S.draft[i];
    let h = `<div class="ed-item${q === 0 ? ' removed' : ''}"><div class="ed-info"><b>${l.n}</b><span>${l.p} · C$${l.pr} por ${l.u}</span>` +
      `<span>Cantidad actual: ${max} ${uw(l, max)}${q > 0 && q < max ? ` <em>Nueva: ${q}</em>` : ''}</span></div>`;
    if (q === 0) h += `<div class="ed-removed">Se quitará del pedido <button type="button" data-k="undo-${i}">Deshacer</button></div>`;
    else h += `<div class="ed-row"><div class="ed-sub">Subtotal<b>${money(q * l.pr)}</b></div><div class="stepper">` +
      `<button type="button" data-k="m-${i}" aria-label="Una unidad menos de ${l.n}">−</button><output>${q}</output>` +
      `<button type="button" data-k="p-${i}" class="${q >= max ? 'off' : ''}" aria-disabled="${q >= max}" aria-label="Una unidad más de ${l.n}">+</button></div></div>`;
    if (S.rmAsk === i) h += `<div class="ed-ask"><span>¿Quitar ${l.n} del pedido?</span><div><button type="button" class="yes" data-k="rm-yes-${i}">Sí, quitar</button><button type="button" data-k="rm-no-${i}">No, dejar 1</button></div></div>`;
    return h + '</div>';
  }).join('');
  const dlg = S.allAsk != null ? `<div class="dlg"><div><p>Si quitás todos los productos, en realidad estás cancelando el pedido. ¿Querés cancelarlo?</p>` +
    `<div class="row"><button type="button" class="yes" data-k="all-cancel">Ir a cancelar el pedido</button><button type="button" data-k="all-back">Volver</button></div></div></div>` : '';
  return `<div class="scrim"></div><div class="sheet" role="dialog" aria-label="Modificar cantidades">${dlg}` +
    `<div class="sheet-h"><button type="button" class="xbtn" data-k="ed-close" aria-label="Cerrar sin enviar"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6z"/></svg></button><h3>Modificar cantidades</h3></div>` +
    `<div class="sheet-b"><p class="ed-note" id="edNote">Pedido N.º ${S.o.id}. Podés reducir cantidades; al llegar a 0 te preguntamos si querés quitar el producto. Para agregar productos o aumentar cantidades, comunicate con tu vendedor.</p>${items}</div>` +
    `<div class="sheet-f"><div class="tot"><span>Total con tus cambios<small>Total actual ${money(tot(S.cur))}</small></span><b>${money(tot(S.draft))}</b></div>` +
    `<button type="button" class="primary" data-k="review" ${changed() ? '' : 'disabled'}>Ver cómo queda mi pedido</button></div></div>`;
}
function motivesHTML(){
  return `<div class="scrim"></div><div class="sheet" role="dialog" aria-label="Motivos de cancelación">` +
    `<div class="sheet-h"><button type="button" class="xbtn" data-k="mot-close" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6z"/></svg></button><h3>Motivos</h3></div>` +
    `<div class="sheet-b">${MOTIVES.map(([c, t]) => `<button type="button" class="mot" data-k="mot-${c}"><span>${t}</span><i></i></button>`).join('')}</div></div>`;
}
function flashNote(){
  const n = $('#edNote'); if (!n) return;
  n.classList.remove('flash'); void n.offsetWidth; n.classList.add('flash');
  if (!n.querySelector('.no-add')){ const s = document.createElement('span'); s.className = 'no-add'; s.textContent = 'Por este medio no se pueden agregar unidades.'; n.append(s); }
}
function editorAct(kind, i){
  if (kind === 'm'){
    if (S.draft[i] > 1){ S.draft[i]--; S.rmAsk = null; }
    else if (S.draft[i] === 1){ if (alive() === 1) S.allAsk = i; else S.rmAsk = i; }
  } else if (kind === 'p'){
    if (S.draft[i] < S.cur[i]){ S.draft[i]++; S.rmAsk = null; } else { renderSheet(); flashNote(); return; }
  } else if (kind === 'rm-yes'){
    if (alive() === 1) S.allAsk = i; else { S.draft[i] = 0; S.rmAsk = null; }
  } else if (kind === 'rm-no'){ S.rmAsk = null; }
  else if (kind === 'undo'){ S.draft[i] = 1; }
  renderSheet();
}
function reopenGroup(){
  const g = S.lastGroup; if (!g) return;
  g.classList.remove('used'); g.querySelectorAll('button').forEach(b => { b.disabled = false; b.classList.remove('picked'); });
}
const SYNC = {
  'ed-close'(){ closeSheet(); S.draft = [...S.cur]; reopenGroup(); },
  review(){ if (!changed()) return; S.summaryDraft = [...S.draft]; closeSheet(); run(async () => {
    user('Ver cómo queda mi pedido');
    await bot(`Así quedaría tu ${ORDER()}:${block(S.draft, S.cur)}` +
      `<div class="keys"><div><b>Total solicitado: ${money(tot(S.draft))}</b> (antes ${money(tot(S.cur))})</div><div><b>Entrega:</b> ${DELIV}</div></div>` +
      `<span class="warnline">⚠️ Es una solicitud: tu pedido no cambia hasta que DIINSA la apruebe.</span>`,
      {buttons:[{k:'send', label:'Enviar solicitud', ic:'send'}, {k:'keep-editing', label:'Seguir modificando', ic:'edit'}, {k:'discard', label:'Descartar cambios', ic:'x'}]});
  }); },
  'all-cancel'(){ closeSheet(); S.draft = [...S.cur]; run(async () => { await H.cancel('Cancelar pedido'); }); },
  'all-back'(){ S.allAsk = null; renderSheet(); },
  motives(){ openSheet('motives'); },
  'mot-close'(){ closeSheet(); },
  'send-text'(){ if (!S.busy) run(sendText); },
  cut(){ run(cut); }
};
function pickMotive(code){
  closeSheet(); if (S.busy) return;
  chat.querySelectorAll('.msg.has-btns:not(.used)').forEach(m => { if (m.querySelector('[data-k="motives"]')){ m.classList.add('used'); m.querySelectorAll('button').forEach(b => b.disabled = true); } });
  run(async () => {
    S.motive = code; S.infoGiven = false;
    user(MOTIVES.find(x => x[0] === code)[1]);
    await afterMotive();
  });
}

/* ------------------------------------------------------------------ responsable de DIINSA */
const canCut = () => !S.responded && S.clock < LATE && !S.pending && !S.cutDone;
async function cut(){
  if (!canCut()) return;
  S.cutDone = true; setClock(LATE);
  setSt('contacto', 'Sin respuesta al corte de las 9:00 p. m.', 'warn');
  if (S.c.risk === 'alto'){
    setSt('visita', 'Revisión prioritaria antes de la salida', 'warn');
    createPending({type:'noreply'});
  } else {
    setSt('pedido', 'Versión 1 vigente', 'ok'); setSt('visita', 'Se mantiene · sin recordatorio', 'ok');
    S.note = 'Riesgo medio sin respuesta: se mantiene la programación ordinaria y no se envía recordatorio.'; renderPanel();
  }
}
function suggested(p){
  const avail = decisionButtons(p).map(b => b[0]);
  return avail.includes(S.decQ[0]) ? S.decQ[0] : defaultChoice(p);
}
function defaultChoice(p){
  if (p.type === 'noreply') return 'keep';
  if (p.type === 'cancel' && p.motive === 'O' && !p.info) return 'info';
  return 'approve';
}
function createPending(p){
  p.at = S.clock; S.pending = p; S.autoChoice = null; renderPanel();
  if (S.mode === 'auto'){
    const choice = suggested(p);
    run(async () => {
      await wait(1800);
      if (S.pending !== p) return;
      S.autoChoice = choice; renderPanel();
      await wait(1100);
      if (S.pending === p) await decide(choice);
    });
  }
}
function diffList(draft, base){
  return S.o.lines.map((l, i) => {
    if (draft[i] === base[i]) return '';
    if (draft[i] === 0) return `<li>${l.n}: se quita (${base[i]} ${uw(l, base[i])})</li>`;
    return `<li>${l.n}: ${base[i]} → ${draft[i]} ${uw(l, draft[i])}</li>`;
  }).join('');
}
async function decide(choice){
  const p = S.pending; if (!p) return;
  S.pending = null; S.autoChoice = null;
  if (S.decQ.length) S.decQ.shift();
  renderPanel();
  if (p.type === 'mod'){
    setClock(S.clock + 6);
    if (choice === 'approve'){
      S.cur = [...p.draft]; S.draft = [...S.cur];
      setSt('pedido', 'Versión 2 aprobada', 'ok'); setSt('carga', 'Ajuste autorizado: bodega retira unidades', 'ok'); setSt('visita', 'Se mantiene · mié 8:00 a. m.–12:00 m.', 'ok');
      S.answered = {type:'decided', text:`tu cambio fue aprobado y tu ${ORDER()} quedó en ${money(tot(S.cur))}`};
      await bot(`<b>Tu pedido cambió</b> ✅<br>Aprobamos tu solicitud. Tu ${ORDER()} queda así:${block(S.cur, S.orig)}` +
        `<div class="keys"><div><b>Nuevo total: ${money(tot(S.cur))}</b> (antes ${money(tot(p.base))})</div><div><b>Entrega:</b> ${DELIV}</div></div>`);
      S.note = 'Bodega ajustó el consolidado antes del corte de carga.';
    } else {
      S.draft = [...S.cur];
      setSt('pedido', 'Versión vigente sin cambios', 'neutral'); setSt('carga', 'Sin ajuste: la carga ya está cerrada', 'stop'); setSt('visita', 'Se mantiene · mié 8:00 a. m.–12:00 m.', 'ok');
      S.answered = {type:'decided', text:`tu cambio no se pudo aplicar y tu ${ORDER()} se mantiene en ${money(tot(S.cur))}`};
      await bot(`<b>Tu pedido no cambió</b> ❌<br>No pudimos aplicar el cambio porque tu pedido ya está preparado para la carga. Se mantiene así:${block(S.cur)}` +
        `<div class="keys"><div><b>Total: ${money(tot(S.cur))}</b></div><div><b>Entrega:</b> ${DELIV}</div></div>Si tenés dudas, comunicate con tu vendedor.`);
      S.note = 'Bodega informó que la carga ya estaba cerrada; el cambio no se aplicó.';
    }
  } else if (p.type === 'cancel'){
    if (choice === 'info'){
      setClock(S.clock + 4);
      S.expect = 'info';
      await bot('Para revisar tu solicitud necesitamos un poco más de detalle. ¿Podés contarnos si el local estará cerrado o si ya no necesitás los productos?');
      suggestText();
      S.note = 'Se pidió más detalle al cliente (R6).';
    } else if (p.late){
      setClock(NEXT + toMin('05:25'));
      setSt('pedido', 'Cancelado', 'stop'); setSt('carga', 'Ya cargado: retorna a bodega', 'warn'); setSt('visita', 'Cancelada antes de la salida', 'stop');
      S.answered = {type:'decided', text:`la visita de hoy del ${ORDER()} quedó cancelada`};
      await bot(`<b>Tu visita de hoy quedó cancelada</b> ✅<br>Transporte canceló la entrega del ${ORDER()} antes de la salida.<br><b>Motivo registrado:</b> ${motiveLabel()}.<br>Tu vendedor te atiende en su próxima visita para un nuevo pedido.`);
      S.note = 'Transporte canceló la visita a las 5:25 a. m.; la mercancía ya cargada regresa a bodega.';
    } else {
      setClock(S.clock + 5);
      setSt('pedido', 'Cancelado', 'stop'); setSt('carga', 'Retirar unidades de la carga', 'stop'); setSt('visita', 'Cancelada', 'stop');
      S.answered = {type:'decided', text:`tu ${ORDER()} quedó cancelado`};
      const extra = p.motive === 'E' ? '<br>Servicio al cliente revisará cómo se registró este pedido.'
        : ['F','H','I','R'].includes(p.motive) ? '<br>Tu vendedor revisará este punto en su próxima visita.' : '';
      await bot(`<b>Tu pedido quedó cancelado</b> ✅<br>Cancelamos el ${ORDER()} y la visita de mañana.<br><b>Motivo registrado:</b> ${motiveLabel()}.${extra}<br>Cuando quieras hacer un nuevo pedido, tu vendedor te atiende en su próxima visita.`);
      S.note = 'Bodega retira las unidades del consolidado y transporte quita la visita de la ruta.';
    }
  } else if (p.type === 'resched'){
    setClock(S.clock + 7);
    if (choice === 'approve'){
      setSt('pedido', 'Reprogramado: miércoles próximo', 'info'); setSt('carga', 'No se carga mañana', 'info'); setSt('visita', 'Reprogramada · mié de la próxima semana', 'info');
      S.answered = {type:'decided', text:`tu entrega quedó reprogramada para el miércoles de la próxima semana`};
      await bot(`<b>Tu entrega cambió de fecha</b> 📅<br>Reprogramamos tu ${ORDER()} para el <b>miércoles de la próxima semana</b>, entre 8:00 a. m. y 12:00 m. El pedido se mantiene así:${block(S.cur)}` +
        `<div class="keys"><div><b>Total: ${money(tot(S.cur))}</b></div></div>Antes de esa entrega te enviaremos de nuevo el resumen para que lo revisés.`);
      S.note = 'Transporte asignó la visita a la ruta del miércoles siguiente (R7).';
    } else {
      setSt('pedido', 'Versión 1 vigente', 'neutral'); setSt('visita', 'Programada · mié 8:00 a. m.–12:00 m.', 'neutral');
      await bot('<b>No pudimos reprogramar tu entrega</b> ❌<br>La ruta del próximo miércoles no tiene espacio para tu zona. ¿Qué preferís?',
        {buttons:[{k:'keep-delivery', label:'Mantener la entrega de mañana', ic:'ok'}, {k:'cancel-go', label:'Cancelar el pedido', ic:'x'}]});
      S.note = 'Transporte no encontró espacio en la ruta siguiente; el cliente decide.';
    }
  } else if (p.type === 'noreply'){
    setClock(NEXT + toMin('05:20'));
    if (choice === 'keep'){
      setSt('visita', 'Se mantiene tras la revisión', 'ok'); setSt('pedido', 'Versión 1 vigente', 'ok');
      S.note = 'Transporte revisó el caso a las 5:20 a. m. y mantuvo la visita; nunca hay cancelación automática.';
    } else {
      setSt('visita', 'No se visita (excepción autorizada)', 'stop'); setSt('carga', 'Ya cargado: retorna a bodega', 'warn'); setSt('pedido', 'No entregado', 'stop');
      await bot(`Hola, ${S.o.name}. Como no recibimos respuesta sobre tu ${ORDER()}, hoy no lo vamos a entregar. Tu vendedor te atiende en su próxima visita.`);
      S.note = 'Se autorizó no visitar al cliente; queda registrado quién lo aprobó.';
    }
  }
  renderPanel();
}

/* ------------------------------------------------------------------ panel interno */
const LBL = {pedido:'Pedido', contacto:'Contacto por WhatsApp', carga:'Carga (bodega)', visita:'Visita (transporte)'};
function decisionButtons(p){
  if (p.type === 'mod') return [['approve','Aprobar cambio','a-ok'], ['reject','No aprobar: la carga ya está cerrada','a-no']];
  if (p.type === 'resched') return [['approve','Aprobar nueva fecha','a-ok'], ['reject','No aprobar: la ruta no tiene espacio','a-no']];
  if (p.type === 'noreply') return [['keep','Mantener la visita','a-ok'], ['skip','No visitar (excepción autorizada)','a-no']];
  const b = [['approve', p.late ? 'Cancelar la visita' : 'Aprobar cancelación', 'a-ok']];
  if (p.motive === 'O' && !p.info) b.push(['info','Pedir más detalle','a-alt']);
  return b;
}
function ruleText(p){
  if (p.type === 'mod') return 'R1 · Reducir o quitar productos antes de las 9:00 p. m.: se aprueba si bodega todavía puede ajustar la carga.';
  if (p.type === 'resched') return 'R7 · Reprogramar a la semana siguiente: sujeto a la planificación de rutas.';
  if (p.type === 'noreply') return 'Riesgo alto sin respuesta: revisión prioritaria antes de la salida; nunca se cancela de forma automática.';
  if (p.late) return 'R4 · Después de las 9:00 p. m. ya no se cambian productos; la visita puede cancelarse hasta las 5:30 a. m.';
  if (p.motive === 'O' && !p.info) return 'R6 · Motivo «otro» poco claro: pedir más detalle antes de decidir.';
  return 'R5 · Cancelación con motivo claro antes de las 9:00 p. m.: se aprueba.';
}
function renderPanel(){
  if (!S.o) return;
  const p = S.pending;
  let h = `<div class="ops-top"><h2>Panel de DIINSA</h2><span class="vis">Vista interna · el cliente no la ve</span></div>` +
    `<p class="ops-meta"><span><b>${S.o.biz}</b> · Pedido N.º ${S.o.id} · Riesgo ${S.c.risk || 'medio'}</span><span class="clock">${dayName(S.clock)} ${fmt(S.clock)}</span></p>` +
    `<div class="status">${['pedido','contacto','carga','visita'].map(k => `<div class="st"><span class="st-l">${LBL[k]}</span><span class="pill ${S.st[k][1]}">${S.st[k][0]}</span></div>`).join('')}</div><div class="req">`;
  if (p){
    const title = {mod:'Solicitud de cambio', resched:'Solicitud de reprogramación', noreply:'Cliente de riesgo alto sin respuesta'}[p.type] || (p.late ? 'Cancelación después del límite' : 'Solicitud de cancelación');
    let det = '';
    if (p.type === 'mod') det = diffList(p.draft, p.base) + `<li>Total: ${money(tot(p.base))} → ${money(tot(p.draft))}</li>`;
    else if (p.type === 'cancel') det = `<li>Motivo: ${motiveLabel()}</li><li>Monto: ${money(tot(S.cur))}</li>`;
    else if (p.type === 'resched') det = `<li>Motivo: ${motiveLabel()}</li><li>Nueva fecha: miércoles de la próxima semana, 8:00 a. m.–12:00 m.</li>`;
    else det = '<li>El cliente no respondió antes del corte de las 9:00 p. m.</li><li>Decide transporte antes de la salida (5:30 a. m.).</li>';
    const sug = suggested(p);
    const auto = S.mode === 'auto';
    h += `<div class="req-card"><h3><span class="dot"></span>${title}</h3><span class="when">Recibida ${dayName(p.at).toLowerCase()} a las ${fmt(p.at)}</span><ul>${det}</ul>` +
      `<p class="rule">${ruleText(p)}</p><div class="acts">` +
      decisionButtons(p).map(([k, t, cls]) => `<button type="button" class="${cls}${auto && S.autoChoice === k ? ' chosen' : ''}" data-k="dec-${k}" ${auto ? 'disabled' : ''}>${t}${!auto && k === sug ? ' <span class="sug">Sugerida</span>' : ''}</button>`).join('') +
      `</div>${auto ? `<p class="auto-note">${S.autoChoice ? 'Decisión automática según la regla.' : 'El responsable está revisando la solicitud…'}</p>` : ''}</div>`;
  } else if (canCut()){
    h += `<p class="req-idle">Esperando la respuesta del cliente.</p><button type="button" class="ghost" data-k="cut">Llegar al corte de las 9:00 p. m. sin respuesta</button>`;
  } else {
    h += `<p class="req-idle">${S.note || 'Sin solicitudes pendientes.'}</p>`;
  }
  ops.innerHTML = h + '</div>';
}

/* ------------------------------------------------------------------ acciones */
function act(k, el){
  let m;
  if ((m = k.match(/^(m|p|rm-yes|rm-no|undo)-(\d+)$/))) return editorAct(m[1], +m[2]);
  if (k.startsWith('mot-') && k !== 'mot-close') return pickMotive(k.slice(4));
  if (SYNC[k]) return SYNC[k]();
  if (k.startsWith('dec-')){ if (S.pending && !S.busy) run(() => decide(k.slice(4))); return; }
  const h = H[k]; if (!h || S.busy) return;
  const msg = el && el.closest('.msg');
  if (msg){ msg.classList.add('used'); msg.querySelectorAll('button').forEach(b => b.disabled = true); el.classList.add('picked'); S.lastGroup = msg; }
  run(() => h(el ? el.dataset.label : k));
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-k]'); if (!el || el.disabled) return;
  if (el.closest('#composer')) return;
  if (S.mode === 'auto' && e.isTrusted && el.closest('.screen, .ops')) return;
  act(el.dataset.k, el);
});
$('#composer').addEventListener('submit', e => {
  e.preventDefault();
  if (S.mode === 'auto' && e.isTrusted) return;
  SYNC['send-text']();
});
input.addEventListener('input', updateComposer);

/* ------------------------------------------------------------------ reproducción automática */
function findEl(k){
  return [...document.querySelectorAll(`[data-k="${k}"]`)].reverse().find(e => !e.disabled && e.offsetParent !== null);
}
function ripple(el){
  if (reduceMotion()) return;
  const r = el.getBoundingClientRect(), d = document.createElement('div');
  d.className = 'tap'; d.style.left = (r.left + r.width / 2) + 'px'; d.style.top = (r.top + r.height / 2) + 'px';
  document.body.append(d); setTimeout(() => d.remove(), 700);
}
async function bringIntoView(el){
  const box = el.closest('.chat, .sheet-b'); if (!box) return;
  const r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
  if (r.top < b.top + 6 || r.bottom > b.bottom - 6){
    box.scrollTo({top:box.scrollTop + (r.top - b.top) - box.clientHeight * 0.45, behavior:reduceMotion() ? 'auto' : 'smooth'});
    await wait(420);
  }
}
async function tapKey(k){
  let el, waited = 0;
  for (;;){
    el = findEl(k);
    if (el && !S.busy) break;
    await wait(120); waited += 120;
    if (waited > 90000) throw new Error('No apareció el paso ' + k);
  }
  await bringIntoView(el); ripple(el); await wait(360);
  el.click();
}
async function typeText(text){
  while (S.busy) await wait(120);
  input.value = '';
  for (const ch of text){ input.value += ch; updateComposer(); await wait(32); }
  await wait(300);
  const b = $('#sendBtn'); ripple(b); await wait(300);
  SYNC['send-text']();
}
async function play(){
  S.playing = true; renderControls();
  await wait(1300);
  for (const st of S.c.s){
    await wait(700);
    if (typeof st === 'string') await tapKey(st);
    else if (st.q){ const [i, n] = st.q; for (let x = 0; x < Math.abs(n); x++){ await tapKey(`${n < 0 ? 'm' : 'p'}-${i}`); await wait(120); } }
    else if (st.type) await typeText(st.type);
    else if (st.clock){ while (S.busy) await wait(120); await wait(500); setClock(toMin(st.clock)); await wait(700); }
  }
  while (S.busy || S.pending) await wait(150);
  S.playing = false; S.done = true; renderControls();
}

/* ------------------------------------------------------------------ inicio y controles */
function start(){
  RUN++; fresh(); closeSheet();
  chat.innerHTML = ''; input.value = ''; updateComposer();
  chip('Martes');
  addMsg('in', initialHTML(), {buttons:OPTS(), noScroll:true});
  chat.scrollTop = 0;
  if (S.c.s[0] && S.c.s[0].type) suggestText();
  setClock(toMin(S.c.read));
  renderPanel(); renderCases(); renderControls();
  if (S.mode === 'auto') run(play, false);
}
function renderControls(){
  $('#mInter').setAttribute('aria-pressed', S.mode === 'inter');
  $('#mAuto').setAttribute('aria-pressed', S.mode === 'auto');
  const pb = $('#btnPause');
  pb.hidden = S.mode !== 'auto';
  if (S.done) pb.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>Repetir';
  else pb.innerHTML = S.paused ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>Continuar'
    : '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>Pausar';
}
function renderCases(){
  const list = $('#caseList');
  list.innerHTML = GROUPS.map((g, gi) => `<h3>${g}</h3>` + CASES.map((c, i) => c.g !== gi ? '' :
    `<button type="button" data-case="${i}" ${i === S.idx ? 'aria-current="true"' : ''}><span class="n">${i + 1}</span><span>${c.t}<small>${ORDERS[c.o].biz}</small></span></button>`).join('')).join('');
}
function setCasesOpen(open){
  $('#caseList').hidden = !open; $('#btnCases').setAttribute('aria-expanded', open);
  if (open){ const cur = $('#caseList [aria-current="true"]'); if (cur) cur.scrollIntoView({block:'nearest'}); }
}
$('#btnCases').addEventListener('click', e => { e.stopPropagation(); setCasesOpen($('#caseList').hidden); });
$('#caseList').addEventListener('click', e => {
  const b = e.target.closest('[data-case]'); if (!b) return;
  S.idx = +b.dataset.case; store.set('dc-case', S.idx); setCasesOpen(false); start();
});
document.addEventListener('click', e => { if (!e.target.closest('.cases')) setCasesOpen(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setCasesOpen(false); });
$('#mInter').addEventListener('click', () => { if (S.mode === 'inter') return; S.mode = 'inter'; store.set('dc-mode', 'inter'); start(); });
$('#mAuto').addEventListener('click', () => { if (S.mode === 'auto') return; S.mode = 'auto'; store.set('dc-mode', 'auto'); start(); });
$('#btnRestart').addEventListener('click', start);
$('#btnPause').addEventListener('click', () => {
  if (S.done){ start(); return; }
  S.paused = !S.paused; renderControls();
});

const savedCase = parseInt(store.get('dc-case'), 10);
if (savedCase >= 0 && savedCase < CASES.length) S.idx = savedCase;
if (store.get('dc-mode') === 'auto') S.mode = 'auto';
window.__demo = { S, CASES, start, select(i, mode){ S.idx = i; if (mode) S.mode = mode; start(); } };
start();
})();
</script>
